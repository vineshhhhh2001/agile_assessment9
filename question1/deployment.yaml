apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal-deployment
  labels:
    app: placement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
        - name: placement-portal
          image: YOUR_DOCKERHUB_USERNAME/placement-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placement-portal-service
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30001
